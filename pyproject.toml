[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexichunk"
version = "0.9.1"
description = "Clause-aware legal document chunking SDK for RAG pipelines"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Emmanuel Cuyugan", email = "148863794+emmcygn@users.noreply.github.com" },
]
requires-python = ">=3.10"
keywords = ["legal", "nlp", "rag", "chunking", "text-splitting", "langchain", "llama-index"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.2.0,<2"]
llama-index = ["llama-index-core>=0.10.0,<0.15"]
# Ingestion adapters. `docling-core` alone is enough to read a
# DoclingDocument (including its JSON form); the full `docling` package is
# only needed to produce one from a PDF, and lexichunk never imports it.
docling = ["docling-core>=2.0"]
examples = [
    "langchain-text-splitters",
    "langchain-community",
    "langchain-openai",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
    "mypy>=1.0",
    "hypothesis>=6.0",
    "ruff==0.16.6",
]
all = [
    "langchain-core>=0.2.0,<2",
    "llama-index-core>=0.10.0,<0.15",
    "docling-core>=2.0",
]

[project.urls]
Homepage = "https://github.com/emmcygn/lexichunk"
Repository = "https://github.com/emmcygn/lexichunk"
Issues = "https://github.com/emmcygn/lexichunk/issues"
Changelog = "https://github.com/emmcygn/lexichunk/blob/master/CHANGELOG.md"
Security = "https://github.com/emmcygn/lexichunk/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
lexichunk = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
ignore = [
    "E402",   # module-level import not at top — we use logger = ... before imports
    "E501",   # line too long — handled by formatter, not linter
    "E741",   # ambiguous variable name — legal domain uses 'l' for level
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "langchain_core.*",
    "llama_index.*",
    "docling_core.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "benchmark: performance benchmarks (deselect with '-m \"not benchmark\"')",
]
# --benchmark-disable keeps `pytest benchmarks/` executable in CI without
# spending CI minutes on timing runs; --strict-markers turns a typo in a
# @pytest.mark name into an error rather than a silently ignored marker.
addopts = "--benchmark-disable --strict-markers"
