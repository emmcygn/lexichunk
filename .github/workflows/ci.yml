name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

# Read-only by default; no job here needs to write to the repository.
permissions:
  contents: read

# A new push to the same branch supersedes the run in flight. `github.ref` is
# used rather than the PR number so a push to master cancels only itself.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ examples/ benchmarks/

      - name: Type check
        run: mypy src/lexichunk/

      - name: Run tests with coverage
        env:
          # Selects the derandomised Hypothesis profile registered in
          # tests/conftest.py, so a property-based failure here reproduces
          # locally with HYPOTHESIS_PROFILE=ci.
          HYPOTHESIS_PROFILE: ci
        run: pytest --tb=short -q --cov=lexichunk --cov-report=term-missing --cov-fail-under=92
