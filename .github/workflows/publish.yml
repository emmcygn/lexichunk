name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

# Read-only by default. The two publish jobs raise this to `id-token: write`
# for the PyPI trusted-publisher exchange, and nothing else needs any write.
permissions:
  contents: read

# Publishing must never be cancelled midway, so in-progress runs are left
# alone; the group only serialises repeated dispatches of the same ref.
concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  integrations:
    uses: ./.github/workflows/integrations.yml

  version-check:
    needs: [test, integrations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Assert pyproject version, package version and tag agree
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import tomllib

          with open('pyproject.toml', 'rb') as f:
              pyproject_version = tomllib.load(f)['project']['version']

          with open('src/lexichunk/__init__.py', encoding='utf-8') as f:
              module = ast.parse(f.read())
          init_version = next(
              node.value.value
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == '__version__'
                  for target in node.targets
              )
              and isinstance(node.value, ast.Constant)
              and isinstance(node.value.value, str)
          )

          assert pyproject_version == init_version, (
              f'pyproject.toml version ({pyproject_version}) != '
              f'lexichunk.__version__ ({init_version})'
          )
          print(f'pyproject.toml and __version__ agree: {pyproject_version}')
          PY

      - name: Assert tag matches package version (tag-triggered runs only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match pyproject.toml version $version"
            exit 1
          fi
          echo "Tag v$tag matches package version $version"

  publish-testpypi:
    needs: [version-check, integrations]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      # A job-level block replaces the workflow default outright, so
      # contents: read is restated rather than inherited.
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [version-check, integrations]
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
