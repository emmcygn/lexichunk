name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

# Read-only by default. The two publish jobs raise this to `id-token: write`
# for the PyPI trusted-publisher exchange, and nothing else needs any write.
permissions:
  contents: read

# Publishing must never be cancelled midway, so in-progress runs are left
# alone; the group only serialises repeated dispatches of the same ref.
concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  integrations:
    uses: ./.github/workflows/integrations.yml

  version-check:
    needs: [test, integrations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert pyproject version, package version and tag agree
        run: |
          python -c "
          import re
          import tomllib

          with open('pyproject.toml', 'rb') as f:
              pyproject_version = tomllib.load(f)['project']['version']

          with open('src/lexichunk/__init__.py', encoding='utf-8') as f:
              init_src = f.read()
          match = re.search(r'__version__\s*=\s*[\"\\']([^\"\\']+)[\"\\']', init_src)
          assert match, '__version__ not found in src/lexichunk/__init__.py'
          init_version = match.group(1)

          assert pyproject_version == init_version, (
              f'pyproject.toml version ({pyproject_version}) != '
              f'lexichunk.__version__ ({init_version})'
          )
          print(f'pyproject.toml and __version__ agree: {pyproject_version}')
          "

      - name: Assert tag matches package version (tag-triggered runs only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match pyproject.toml version $version"
            exit 1
          fi
          echo "Tag v$tag matches package version $version"

  publish-testpypi:
    needs: version-check
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions with twine
        run: twine check dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: version-check
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions with twine
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
